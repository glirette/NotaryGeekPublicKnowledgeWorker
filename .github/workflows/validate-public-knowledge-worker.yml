name: Validate Public Knowledge Worker

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build .\NotaryGeekPublicKnowledgeWorker.slnx -c Release
          dotnet test .\NotaryGeekPublicKnowledgeWorker.slnx -c Release --no-build

      - name: Validate public JSON
        shell: pwsh
        run: |
          $jsonFiles = @(Get-ChildItem -Recurse -Filter *.json -File | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })
          foreach ($file in $jsonFiles) {
            Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json | Out-Null
          }

          Write-Host "Validated $($jsonFiles.Count) public JSON files."
