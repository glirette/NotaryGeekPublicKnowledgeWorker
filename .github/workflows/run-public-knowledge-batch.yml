name: Run Public Knowledge Batch

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Regression batch to run.
        required: true
        default: Platform
        type: choice
        options:
          - Core
          - Platform
          - NNA
          - Apostille
          - Recipient
          - All
      dry_run:
        description: Fetch sources and build prompts without calling OpenAI.
        required: true
        default: false
        type: boolean
      provider:
        description: Provider lane for this run. Default uses the Azure Function app setting.
        required: true
        default: Default
        type: choice
        options:
          - Default
          - OpenAI
          - Straico
      async:
        description: Submit the batch to the Azure queue and return quickly.
        required: true
        default: true
        type: boolean
      wait_for_completion:
        description: When async is true, poll the queued job until scored receipts are available.
        required: true
        default: true
        type: boolean
      poll_seconds:
        description: Polling interval when waiting for a queued job.
        required: true
        default: 20
        type: number
      timeout_minutes:
        description: Maximum minutes to wait for a queued job.
        required: true
        default: 45
        type: number

permissions:
  contents: read

concurrency:
  group: public-knowledge-batch
  cancel-in-progress: false

jobs:
  run-batch:
    name: Run Protected Batch
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run batch
        shell: pwsh
        env:
          PUBLIC_KNOWLEDGE_FUNCTION_KEY: ${{ secrets.PUBLIC_KNOWLEDGE_FUNCTION_KEY }}
          PUBLIC_KNOWLEDGE_BASE_URL: ${{ secrets.PUBLIC_KNOWLEDGE_BASE_URL }}
          PUBLIC_KNOWLEDGE_BATCH: ${{ inputs.batch }}
          PUBLIC_KNOWLEDGE_DRY_RUN: ${{ inputs.dry_run }}
          PUBLIC_KNOWLEDGE_PROVIDER: ${{ inputs.provider }}
          PUBLIC_KNOWLEDGE_ASYNC: ${{ inputs.async }}
          PUBLIC_KNOWLEDGE_WAIT_FOR_COMPLETION: ${{ inputs.wait_for_completion }}
          PUBLIC_KNOWLEDGE_POLL_SECONDS: ${{ inputs.poll_seconds }}
          PUBLIC_KNOWLEDGE_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_FUNCTION_KEY)) {
            throw "Missing required secret PUBLIC_KNOWLEDGE_FUNCTION_KEY."
          }

          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_BASE_URL)) {
            throw "Missing required secret PUBLIC_KNOWLEDGE_BASE_URL."
          }

          if ($env:PUBLIC_KNOWLEDGE_ASYNC -eq "true" -and $env:PUBLIC_KNOWLEDGE_WAIT_FOR_COMPLETION -eq "true") {
            $queuedArguments = @{
              BaseUrl = $env:PUBLIC_KNOWLEDGE_BASE_URL
              FunctionKey = $env:PUBLIC_KNOWLEDGE_FUNCTION_KEY
              Batch = $env:PUBLIC_KNOWLEDGE_BATCH
              PollSeconds = [int] $env:PUBLIC_KNOWLEDGE_POLL_SECONDS
              TimeoutMinutes = [int] $env:PUBLIC_KNOWLEDGE_TIMEOUT_MINUTES
              FailOnBadStatus = $true
              OutDir = "artifacts/public-knowledge-batch"
            }

            if ($env:PUBLIC_KNOWLEDGE_DRY_RUN -eq "true") {
              $queuedArguments.DryRun = $true
            }

            if ($env:PUBLIC_KNOWLEDGE_PROVIDER -ne "Default") {
              $queuedArguments.Provider = $env:PUBLIC_KNOWLEDGE_PROVIDER
            }

            .\tools\Submit-PublicKnowledgeQueuedBatch.ps1 @queuedArguments
            exit 0
          }

          $arguments = @{
            BaseUrl = $env:PUBLIC_KNOWLEDGE_BASE_URL
            FunctionKey = $env:PUBLIC_KNOWLEDGE_FUNCTION_KEY
            Command = if ($env:PUBLIC_KNOWLEDGE_ASYNC -eq "true") { "SubmitBatch" } else { "RunBatch" }
            Batch = $env:PUBLIC_KNOWLEDGE_BATCH
          }

          if ($env:PUBLIC_KNOWLEDGE_DRY_RUN -eq "true") {
            $arguments.DryRun = $true
          }

          if ($env:PUBLIC_KNOWLEDGE_PROVIDER -ne "Default") {
            $arguments.Provider = $env:PUBLIC_KNOWLEDGE_PROVIDER
          }

          $result = .\tools\Invoke-PublicKnowledgeStoredRun.ps1 @arguments
          $result | Format-Table -AutoSize

          if ($env:PUBLIC_KNOWLEDGE_ASYNC -eq "true") {
            if (-not $result.Ok) {
              throw "Public knowledge batch was not queued."
            }
          }
          else {
            $failed = @($result | Where-Object { -not $_.Ok })
            if ($failed.Count -gt 0) {
              throw "Public knowledge batch had $($failed.Count) failed case(s)."
            }
          }

      - name: Print latest digest
        if: ${{ always() }}
        shell: pwsh
        env:
          PUBLIC_KNOWLEDGE_FUNCTION_KEY: ${{ secrets.PUBLIC_KNOWLEDGE_FUNCTION_KEY }}
          PUBLIC_KNOWLEDGE_BASE_URL: ${{ secrets.PUBLIC_KNOWLEDGE_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_FUNCTION_KEY) -or [string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_BASE_URL)) {
            Write-Host "Digest skipped because protected worker secrets are not configured."
            exit 0
          }

          .\tools\Invoke-PublicKnowledgeStoredRun.ps1 `
            -BaseUrl $env:PUBLIC_KNOWLEDGE_BASE_URL `
            -FunctionKey $env:PUBLIC_KNOWLEDGE_FUNCTION_KEY `
            -Command LatestDigest |
            Format-Table -AutoSize

          try {
            .\tools\Invoke-PublicKnowledgeStoredRun.ps1 `
              -BaseUrl $env:PUBLIC_KNOWLEDGE_BASE_URL `
              -FunctionKey $env:PUBLIC_KNOWLEDGE_FUNCTION_KEY `
              -Command Jobs `
              -Take 10 |
              Format-Table -AutoSize
          }
          catch {
            Write-Host "Recent jobs skipped: $($_.Exception.Message)"
          }

      - name: Write queued batch summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $jobFile = "artifacts/public-knowledge-batch/job-final.json"
          if (-not (Test-Path -LiteralPath $jobFile)) {
            Write-Host "No queued batch job artifact found."
            exit 0
          }

          $response = Get-Content -LiteralPath $jobFile -Raw | ConvertFrom-Json
          $job = $response.job
          if ($null -eq $job) {
            Write-Host "Queued batch job artifact did not contain a job object."
            exit 0
          }

          $providerSummary = if ([string]::IsNullOrWhiteSpace($job.ProviderOverride)) { "Default" } else { $job.ProviderOverride }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Public Knowledge Batch"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Job: ``{0}``" -f $job.JobId)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Batch: ``{0}``" -f $job.Batch)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Provider: ``{0}``" -f $providerSummary)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Status: ``{0}``" -f $job.Status)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Completed: ``{0}/{1}``" -f $job.CompletedCount, $job.TotalCount)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "| Case | Ok | Verdict | Must hold | Failure signals | Warnings | Errors |"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "| --- | --- | --- | --- | --- | ---: | ---: |"

          foreach ($receipt in @($job.Receipts)) {
            $mustHold = if ($null -ne $receipt.MustHoldTotal) { "{0}/{1}" -f $receipt.MustHoldPassed, $receipt.MustHoldTotal } else { "" }
            $failureSignals = if ($null -ne $receipt.FailureSignalTotal) { "{0}/{1}" -f $receipt.FailureSignalsObserved, $receipt.FailureSignalTotal } else { "" }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("| ``{0}`` | {1} | {2} | {3} | {4} | {5} | {6} |" -f $receipt.CaseId, $receipt.Ok, $receipt.ScoreVerdict, $mustHold, $failureSignals, $receipt.WarningCount, $receipt.ErrorCount)
          }

      - name: Upload batch diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: public-knowledge-batch-${{ inputs.batch }}-${{ github.run_id }}
          path: artifacts/public-knowledge-batch
          if-no-files-found: ignore
