name: Deploy Public Knowledge Worker

on:
  workflow_dispatch:
    inputs:
      run_status_check:
        description: Call the protected status endpoint after deployment if PUBLIC_KNOWLEDGE_FUNCTION_KEY is configured.
        required: true
        default: true
        type: boolean
      run_batch_after_deploy:
        description: Run a public knowledge regression batch after deployment if PUBLIC_KNOWLEDGE_FUNCTION_KEY and PUBLIC_KNOWLEDGE_BASE_URL are configured.
        required: true
        default: true
        type: boolean
      batch_after_deploy:
        description: Regression batch to run after deployment.
        required: true
        default: Platform
        type: choice
        options:
          - Core
          - Platform
          - NNA
          - Apostille
          - Recipient
          - All

permissions:
  contents: read

concurrency:
  group: public-knowledge-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure Function
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Confirm publish profile secret
        shell: pwsh
        env:
          PUBLIC_KNOWLEDGE_PUBLISH_PROFILE: ${{ secrets.PUBLIC_KNOWLEDGE_PUBLISH_PROFILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_PUBLISH_PROFILE)) {
            throw "Missing required secret PUBLIC_KNOWLEDGE_PUBLISH_PROFILE."
          }

      - name: Deploy by Kudu ZIP Deploy
        shell: pwsh
        env:
          PUBLIC_KNOWLEDGE_PUBLISH_PROFILE: ${{ secrets.PUBLIC_KNOWLEDGE_PUBLISH_PROFILE }}
        run: |
          .\tools\Deploy-PublicKnowledgeWorker.ps1 `
            -Configuration Release `
            -DeploymentPollTimeoutSeconds 600 `
            -DeploymentPollIntervalSeconds 5

      - name: Protected status check
        if: ${{ inputs.run_status_check }}
        shell: pwsh
        env:
          PUBLIC_KNOWLEDGE_FUNCTION_KEY: ${{ secrets.PUBLIC_KNOWLEDGE_FUNCTION_KEY }}
          PUBLIC_KNOWLEDGE_STATUS_URL: ${{ secrets.PUBLIC_KNOWLEDGE_STATUS_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_FUNCTION_KEY)) {
            Write-Host "PUBLIC_KNOWLEDGE_FUNCTION_KEY is not configured. Skipping protected status check."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_STATUS_URL)) {
            Write-Host "PUBLIC_KNOWLEDGE_STATUS_URL is not configured. Skipping protected status check."
            exit 0
          }

          $encodedKey = [System.Uri]::EscapeDataString($env:PUBLIC_KNOWLEDGE_FUNCTION_KEY)
          $status = Invoke-RestMethod `
            -Method Get `
            -Uri "$($env:PUBLIC_KNOWLEDGE_STATUS_URL)?code=$encodedKey" `
            -TimeoutSec 60

          if (-not $status.ok) {
            throw "Public Knowledge Worker status endpoint returned ok=false."
          }

          $summary = [pscustomobject]@{
            enabled = $status.status.Enabled
            timerEnabled = $status.status.TimerEnabled
            model = $status.status.Model
            hasOpenAiApiKey = $status.status.HasOpenAiApiKey
            maxSourcesPerRun = $status.status.MaxSourcesPerRun
            storageHasConnectionString = $status.storage.HasConnectionString
          }

          $summary | ConvertTo-Json -Depth 4

      - name: Run regression batch after deploy
        if: ${{ inputs.run_batch_after_deploy }}
        shell: pwsh
        env:
          PUBLIC_KNOWLEDGE_FUNCTION_KEY: ${{ secrets.PUBLIC_KNOWLEDGE_FUNCTION_KEY }}
          PUBLIC_KNOWLEDGE_BASE_URL: ${{ secrets.PUBLIC_KNOWLEDGE_BASE_URL }}
          PUBLIC_KNOWLEDGE_BATCH: ${{ inputs.batch_after_deploy }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_FUNCTION_KEY)) {
            Write-Host "PUBLIC_KNOWLEDGE_FUNCTION_KEY is not configured. Skipping post-deploy batch run."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_BASE_URL)) {
            Write-Host "PUBLIC_KNOWLEDGE_BASE_URL is not configured. Skipping post-deploy batch run."
            exit 0
          }

          $result = .\tools\Invoke-PublicKnowledgeStoredRun.ps1 `
            -BaseUrl $env:PUBLIC_KNOWLEDGE_BASE_URL `
            -FunctionKey $env:PUBLIC_KNOWLEDGE_FUNCTION_KEY `
            -Command SubmitBatch `
            -Batch $env:PUBLIC_KNOWLEDGE_BATCH

          $result | Format-Table -AutoSize

          if (-not $result.Ok) {
            throw "Post-deploy public knowledge batch was not queued."
          }

      - name: Print latest digest
        if: ${{ always() }}
        shell: pwsh
        env:
          PUBLIC_KNOWLEDGE_FUNCTION_KEY: ${{ secrets.PUBLIC_KNOWLEDGE_FUNCTION_KEY }}
          PUBLIC_KNOWLEDGE_BASE_URL: ${{ secrets.PUBLIC_KNOWLEDGE_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_FUNCTION_KEY) -or [string]::IsNullOrWhiteSpace($env:PUBLIC_KNOWLEDGE_BASE_URL)) {
            Write-Host "Digest skipped because protected worker secrets are not configured."
            exit 0
          }

          .\tools\Invoke-PublicKnowledgeStoredRun.ps1 `
            -BaseUrl $env:PUBLIC_KNOWLEDGE_BASE_URL `
            -FunctionKey $env:PUBLIC_KNOWLEDGE_FUNCTION_KEY `
            -Command LatestDigest |
            Format-Table -AutoSize

          try {
            .\tools\Invoke-PublicKnowledgeStoredRun.ps1 `
              -BaseUrl $env:PUBLIC_KNOWLEDGE_BASE_URL `
              -FunctionKey $env:PUBLIC_KNOWLEDGE_FUNCTION_KEY `
              -Command Jobs `
              -Take 10 |
              Format-Table -AutoSize
          }
          catch {
            Write-Host "Recent jobs skipped: $($_.Exception.Message)"
          }
